      --bg: #0f172a;
      --bg-soft: #1e293b;
      --card: #162033;
      --card-hover: #1d2b44;
      --border: #2b3b57;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --success: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: 100vh;
    }
    aside {

      border-right: 1px solid var(--border);
      padding: 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    main {
      padding: 28px 36px 80px;
      max-width: 1050px;
      width: 100%;
      margin: 0 auto;
    }

    /* Header & Gamification HUD */
    .brand-box h1 {
      font-size: 1.15rem;
      margin: 0 0 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-box p {
      margin: 0;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .hud-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .rank-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .xp-text { font-size: 0.85rem; font-weight: 700; color: var(--warn); }
    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--success));
      transition: width 0.35s ease;
    }
    .hud-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 8px;
    }

      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      padding: 9px 11px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.86rem;
      transition: all 0.15s;
    }
    .nav-btn:hover { background: var(--card); color: var(--text); }
    .nav-btn.active {
      background: var(--card-hover);
      color: var(--text);
      border-color: var(--accent);
    }
    .nav-btn .status-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      flex-shrink: 0;

      background: var(--success);
      border-color: var(--success);
      color: #052e16;
      font-weight: 800;
    }

      padding-bottom: 16px;

      color: var(--text);
      padding: 8px 14px;

      color: #0f172a;
      border-color: var(--accent);
    }

      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;

      font-size: 0.85rem;
      outline: none;

      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.86rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-success { background: var(--success); color: #052e16; }

      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;

    }

      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;

    .card-body { font-size: 0.88rem; color: #cbd5e1; }

      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(148, 163, 184, 0.15);
      color: var(--muted);
      margin-right: 4px;
      margin-top: 4px;

      border-left: 3px solid var(--warn);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.86rem;
      margin: 10px 0;
      color: #fde68a;
    }

      gap: 6px;
      cursor: pointer;

      color: var(--muted);
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 4px 9px;
      border-radius: 999px;

      color: #052e16;
      border-color: var(--success);
      font-weight: 700;

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
      background: var(--card);
      border-radius: 10px;
      overflow: hidden;

      text-align: left;

      text-align: left;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      font-size: 0.86rem;

      text-align: center;

    .flashcard {
      background: linear-gradient(145deg, #1b2740, #121a2d);

      border-radius: 18px;
      padding: 40px 28px;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      margin-bottom: 16px;

    .flashcard h3 { font-size: 1.3rem; margin: 0; }

    .badge-card {

      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      opacity: 0.45;
      text-align: center;

      border-color: var(--warn);
      background: rgba(245, 158, 11, 0.08);

    .mobile-toggle { display: none; }

      .app-shell { grid-template-columns: 1fr; }

        position: fixed;
        left: -320px;
        width: 290px;
        z-index: 50;
        transition: left 0.25s;

      aside.open { left: 0; }
      main { padding: 18px 16px 70px; }
      .mobile-toggle {

        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 8px 12px;
        border-radius: 8px;

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--success);
      color: #052e16;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      display: none;
      z-index: 100;
    }
  </style>
</head>

========================================================= */
const STORAGE_KEY = "pr_crux_learning_state_v1";
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || {
  checked: [],
  quizzesPassed: [],
  xp: 0,
  flips: 0,
  activeModule: "m1"
};

let currentView = "learn";
let searchQuery = "";
let flashIndex = 0;
let flashFlipped = false;

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getAllItemIds() {
  const ids = [];
  MODULES.forEach(m => m.sections.forEach(s => s.items.forEach(it => ids.push(it.id))));
  return ids;
}

function isModuleDone(mod) {
  const ids = [];
  mod.sections.forEach(s => s.items.forEach(it => ids.push(it.id)));
  return ids.length > 0 && ids.every(id => state.checked.includes(id));
}

function getRank(xp) {
  if (xp >= 1200) return "Level 6: Cannes Grand Prix";
  if (xp >= 900)  return "Level 5: Reputation Architect";
  if (xp >= 600)  return "Level 4: Crisis Whisperer";
  if (xp >= 350)  return "Level 3: Narrative Strategist";
  if (xp >= 150)  return "Level 2: Media Pitcher";
  return "Level 1: PR Rookie";
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.display = "none"; }, 2400);
}

   RENDERING
========================================================= */
function updateHUD() {
  const allIds = getAllItemIds();
  const doneCount = state.checked.length;
  const pct = Math.round((doneCount / allIds.length) * 100);
  const doneMods = MODULES.filter(isModuleDone).length;

  document.getElementById("rankBadge").textContent = getRank(state.xp);
  document.getElementById("xpText").textContent = `${state.xp} XP`;
  document.getElementById("overallProgressFill").style.width = `${pct}%`;
  document.getElementById("overallPercent").textContent = `${pct}% (${doneCount}/${allIds.length} cards)`;
  document.getElementById("modulesCount").textContent = `${doneMods} / ${MODULES.length} Modules`;
}

    m.sections.forEach(s => s.items.forEach(it => ids.push(it.id)));
    const doneInMod = ids.filter(id => state.checked.includes(id)).length;
    const allDone = doneInMod === ids.length;
    const isActive = currentView === "learn" && state.activeModule === m.id && !searchQuery;

    return `
      <button class="nav-btn ${isActive ? 'active' : ''} ${allDone ? 'done' : ''}" onclick="selectModule('${m.id}')">
        <span style="display:flex;align-items:center;gap:8px;min-width:0;">
          <span class="status-dot">${allDone ? '✓' : m.num}</span>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${m.title}</span>
        </span>
        <span class="nav-meta">${doneInMod}/${ids.length}</span>
      </button>
    `;
  }).join("");
}

function toggleItem(id) {
  const idx = state.checked.indexOf(id);
  if (idx === -1) {
    state.checked.push(id);
    state.xp += 15;
    showToast("+15 XP! Card marked complete");
  } else {
    state.checked.splice(idx, 1);
    state.xp = Math.max(0, state.xp - 15);
  }
  saveState();
  renderAll();
}

function markModuleComplete(modId) {
  const mod = MODULES.find(m => m.id === modId);
  let added = 0;
  mod.sections.forEach(s => s.items.forEach(it => {
    if (!state.checked.includes(it.id)) {
      state.checked.push(it.id);
      added++;
    }
  }));
  if (added > 0) {
    state.xp += added * 15 + 25;
    showToast(`Module Complete! +${added * 15 + 25} XP 🎉`);
  } else {
    showToast("Module already completed!");
  }
  saveState();
  renderAll();
}

function answerQuiz(modId, qIdx, optIdx, btn) {
  const mod = MODULES.find(m => m.id === modId);
  const q = mod.quiz[qIdx];
  const parent = btn.parentElement;
  if (parent.dataset.answered) return;
  parent.dataset.answered = "1";

  const buttons = parent.querySelectorAll(".quiz-opt");
  buttons.forEach((b, i) => {
    if (i === q.ans) b.classList.add("correct");
    else if (i === optIdx) b.classList.add("wrong");
  });

  const expEl = document.createElement("div");
  expEl.style.fontSize = "0.82rem";
  expEl.style.marginTop = "6px";
  expEl.style.color = optIdx === q.ans ? "#86efac" : "#fca5a5";
  expEl.textContent = (optIdx === q.ans ? "✅ Correct! " : "❌ Not quite. ") + q.exp;
  parent.appendChild(expEl);

  if (optIdx === q.ans) {
    state.xp += 25;
    if (!state.quizzesPassed.includes(`${modId}_${qIdx}`)) {
      state.quizzesPassed.push(`${modId}_${qIdx}`);
    }
    saveState();
    updateHUD();
    showToast("+25 Bonus XP!");
  }
}

function renderCardHTML(it) {
  const isChecked = state.checked.includes(it.id);
  return `
    <div class="card ${isChecked ? 'checked' : ''}">
      <div class="card-header">
        <div>
          <h4 class="card-title">${it.title}</h4>
          <div class="card-sub">${it.sub}</div>
        </div>
        <button class="check-toggle" onclick="toggleItem('${it.id}')">
          ${isChecked ? '✓ Done' : 'Mark Done'}
        </button>
      </div>
      <div class="card-body">${it.body}</div>
    </div>
  `;
}

function renderMain() {
  const container = document.getElementById("mainContent");

  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    const matches = [];
    MODULES.forEach(m => m.sections.forEach(s => s.items.forEach(it => {
      if ((it.title + it.sub + it.body).toLowerCase().includes(q)) {
        matches.push({ mod: m.title, item: it });
      }
    })));
    container.innerHTML = `
      <div class="module-hero">
        <div>
          <h2>Search Results for "${searchQuery}"</h2>
          <p>Found ${matches.length} matching item(s) across the repository.</p>
        </div>
        <button class="btn btn-outline" onclick="clearSearch()">Clear Search</button>
      </div>
      <div class="card-grid">
        ${matches.length ? matches.map(m => renderCardHTML(m.item)).join("") : "<p style='color:var(--muted)'>No matches found.</p>"}
      </div>
    `;
    return;
  }

  if (currentView === "flashcards") {
    const card = FLASHCARDS[flashIndex];
    container.innerHTML = `
      <div class="module-hero">
        <div>
          <h2>⚡ Flashcard Arena</h2>
          <p>Click the card to flip and test your memory on core PR frameworks, stats & leaders. (+5 XP per flip)</p>
        </div>
        <span class="rank-badge">Card ${flashIndex + 1} of ${FLASHCARDS.length}</span>
      </div>
      <div class="flashcard-stage">
        <div class="flashcard" onclick="flipFlashcard()">
          <small>${flashFlipped ? 'Answer / Takeaway' : 'Concept / Prompt (Click to Reveal)'}</small>
          <h3>${flashFlipped ? '' : card.front}</h3>
          <p>${flashFlipped ? card.back : 'Tap to flip card'}</p>
        </div>
        <div style="display:flex; justify-content:center; gap:12px;">
          <button class="btn btn-outline" onclick="prevFlash()">← Previous</button>
          <button class="btn" onclick="nextFlash()">Next Card →</button>
        </div>
      </div>
    `;
    return;
  }

  if (currentView === "badges") {
    const tot = getAllItemIds().length;
    container.innerHTML = `
      <div class="module-hero">
        <div>
          <h2>🏆 Achievements & Mastery</h2>
          <p>Unlock badges as you progress through all 9 modules, pass quizzes, and master the flashcards.</p>
        </div>
      </div>
      <div class="badges-grid">
        ${BADGES.map(b => {
          const unlocked = b.check(state, tot);
          return `
            <div class="badge-card ${unlocked ? 'unlocked' : ''}">
              <div class="badge-icon">${b.icon}</div>
              <h4 style="margin:0 0 4px;">${b.name}</h4>
              <p style="margin:0; font-size:0.8rem; color:var(--muted);">${b.desc}</p>
              <div style="margin-top:8px; font-size:0.74rem; font-weight:700; color:${unlocked ? 'var(--warn)' : 'var(--muted)'}">
                ${unlocked ? 'UNLOCKED' : 'LOCKED'}
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;
    return;
  }

  // Learn View
  const mod = MODULES.find(m => m.id === state.activeModule) || MODULES[0];
  const modDone = isModuleDone(mod);
  const modIdx = MODULES.findIndex(m => m.id === mod.id);
  const nextMod = MODULES[modIdx + 1];

  container.innerHTML = `
    <div class="module-hero">
      <div>
        <span class="tag" style="color:var(--accent); margin-bottom:6px;">MODULE ${mod.num} OF ${MODULES.length}</span>
        <h2>${mod.title}</h2>
        <p>${mod.subtitle}</p>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn ${modDone ? 'btn-success' : ''}" onclick="markModuleComplete('${mod.id}')">
          ${modDone ? '✓ Module Completed' : '✓ Mark Whole Module Complete'}
        </button>
        ${nextMod ? `<button class="btn btn-outline" onclick="selectModule('${nextMod.id}')">Next: ${nextMod.num}. ${nextMod.title.split(' ')[0]} →</button>` : ''}
      </div>
    </div>

    ${mod.sections.map(sec => `
      <div class="section-group">
        <h3 class="section-title">◆ ${sec.heading}</h3>
        <div class="card-grid">
          ${sec.items.map(renderCardHTML).join("")}
        </div>
      </div>
    `).join("")}

    ${mod.quiz && mod.quiz.length ? `
      <div class="quiz-box">
        <h3 style="margin:0 0 14px; color:var(--accent-2);">🧠 Module ${mod.num} Quick Knowledge Check (+25 XP each)</h3>
        ${mod.quiz.map((q, qi) => `
          <div class="quiz-q">
            <p>${qi + 1}. ${q.q}</p>
            ${q.opts.map((opt, oi) => `
              <button class="quiz-opt" onclick="answerQuiz('${mod.id}', ${qi}, ${oi}, this)">${opt}</button>
            `).join("")}
          </div>
        `).join("")}
      </div>
    ` : ''}
  `;
}

function selectModule(id) {
  state.activeModule = id;
  currentView = "learn";
  searchQuery = "";
  document.getElementById("searchInput").value = "";
  saveState();
  updatePills();
  renderAll();
  document.getElementById("sidebar").classList.remove("open");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function switchView(view) {
  currentView = view;
  searchQuery = "";
  document.getElementById("searchInput").value = "";
  updatePills();
  renderAll();
}

function updatePills() {
  document.getElementById("tabLearn").classList.toggle("active", currentView === "learn");
  document.getElementById("tabFlash").classList.toggle("active", currentView === "flashcards");
  document.getElementById("tabBadges").classList.toggle("active", currentView === "badges");
}

function handleSearch(val) {
  searchQuery = val;
  renderMain();
}

function clearSearch() {
  searchQuery = "";
  document.getElementById("searchInput").value = "";
  renderAll();
}

function flipFlashcard() {
  flashFlipped = !flashFlipped;
  if (flashFlipped) {
    state.flips += 1;
    state.xp += 5;
    saveState();
    updateHUD();
  }
  renderMain();
}

function nextFlash() {
  flashIndex = (flashIndex + 1) % FLASHCARDS.length;
  flashFlipped = false;
  renderMain();
}

function prevFlash() {
  flashIndex = (flashIndex - 1 + FLASHCARDS.length) % FLASHCARDS.length;
  flashFlipped = false;
  renderMain();
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}

function copyShareSummary() {
  const tot = getAllItemIds().length;
  const pct = Math.round((state.checked.length / tot) * 100);
  const doneMods = MODULES.filter(isModuleDone).length;
  const text = `PR Crux Learning Progress: ${pct}% Complete (${doneMods}/9 modules, ${state.checked.length}/${tot} cards) | ${getRank(state.xp)} (${state.xp} XP)`;
  navigator.clipboard.writeText(text).then(() => {
    showToast("Progress summary copied to clipboard!");
  }).catch(() => {
    alert(text);
  });
}

function resetAllProgress() {
  if (confirm("Reset all XP, badges, and completed cards?")) {
    state = { checked: [], quizzesPassed: [], xp: 0, flips: 0, activeModule: "m1" };
    saveState();
    renderAll();
    showToast("Progress reset.");
  }
}

function renderAll() {
  updateHUD();
  renderSidebar();
  renderMain();
}

renderAll();
</script>
</body>
</html>
