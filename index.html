<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PR Crux, Learnings & Nuggets — Full Interactive Learning Guide</title>
  <style>
    :root {
      --bg: #0f172a;
      --sidebar: #0b1120;
      --card: #162033;
      --card-2: #1c2840;
      --border: #2a3a57;
      --text: #f1f5f9;
      --text-soft: #cbd5e1;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --success: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --callout-bg: rgba(56, 189, 248, 0.08);
      --warn-bg: rgba(245, 158, 11, 0.1);
      --warn-text: #fde68a;
      --radius: 14px;
    }
    body.light {
      --bg: #f8fafc;
      --sidebar: #ffffff;
      --card: #ffffff;
      --card-2: #f1f5f9;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-soft: #334155;
      --muted: #64748b;
      --accent: #0284c7;
      --accent-2: #4f46e5;
      --callout-bg: #eff6ff;
      --warn-bg: #fffbeb;
      --warn-text: #92400e;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      font-size: 15.5px;
      transition: background 0.2s, color 0.2s;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .app-shell {
      display: grid;
      grid-template-columns: 310px 1fr;
      min-height: 100vh;
    }
    aside {
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    main {
      padding: 28px 40px 90px;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
    }

    .brand-box h1 {
      font-size: 1.15rem;
      margin: 0 0 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-box p { margin: 0; font-size: 0.8rem; color: var(--muted); }

    .hud-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .hud-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .rank-badge {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--callout-bg);
      color: var(--accent);
      border: 1px solid var(--border);
    }
    .xp-text { font-size: 0.85rem; font-weight: 700; color: var(--warn); }
    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: var(--card-2);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--success));
      transition: width 0.35s ease;
    }
    .hud-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 8px;
    }

    .nav-list { display: flex; flex-direction: column; gap: 5px; }
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .nav-btn:hover { background: var(--card-2); color: var(--text); }
    .nav-btn.active { background: var(--card-2); color: var(--text); border-color: var(--accent); font-weight: 600; }
    .nav-btn .status-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      flex-shrink: 0;
    }
    .nav-btn.done .status-dot {
      background: var(--success);
      border-color: var(--success);
      color: #052e16;
      font-weight: 800;
    }
    .nav-meta { font-size: 0.72rem; opacity: 0.85; white-space: nowrap; }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .mode-pills { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .pill-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 600;
    }
    .pill-btn.active { background: var(--accent); color: #ffffff; border-color: var(--accent); }
    body:not(.light) .pill-btn.active { color: #0f172a; }

    .search-input {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      min-width: 230px;
      font-size: 0.85rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }

    .module-hero {
      background: var(--callout-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 22px;
    }
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }
    .module-hero h2 { margin: 4px 0 8px; font-size: 1.55rem; line-height: 1.25; }
    .module-hero p { margin: 0; color: var(--text-soft); font-size: 0.95rem; }
    .layman-box {
      margin-top: 14px;
      padding: 12px 14px;
      background: var(--card);
      border-left: 4px solid var(--accent-2);
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text-soft);
    }

    .btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 9px 15px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    body.light .btn { color: #ffffff; }
    .btn:hover { opacity: 0.92; }
    .btn-outline { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    body.light .btn-outline { color: var(--text); }
    .btn-success { background: var(--success); color: #052e16 !important; }

    /* Filter sub-bar */
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .filter-chip {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
    }
    .filter-chip.active {
      background: var(--accent-2);
      color: #fff;
      border-color: var(--accent-2);
    }

    /* Lesson Cards (Spacious editorial reading layout) */
    .section-group { margin-bottom: 30px; }
    .section-title {
      font-size: 1.15rem;
      margin: 0 0 14px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .lesson-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .lesson-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      transition: border-color 0.2s;
    }
    .lesson-card.checked {
      border-color: rgba(34, 197, 94, 0.6);
      box-shadow: inset 4px 0 0 var(--success);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 10px;
    }
    .card-title { font-weight: 700; font-size: 1.08rem; margin: 0; line-height: 1.35; }
    .card-sub { font-size: 0.82rem; color: var(--accent-2); margin-top: 3px; font-weight: 600; }
    .card-body { font-size: 0.94rem; color: var(--text-soft); }
    .card-body p { margin: 0 0 10px; }
    .card-body p:last-child { margin-bottom: 0; }
    .card-body ul, .card-body ol { padding-left: 20px; margin: 8px 0; }
    .card-body li { margin-bottom: 5px; }

    .callout {
      background: var(--callout-bg);
      border-left: 3px solid var(--accent);
      padding: 10px 14px;
      border-radius: 8px;
      margin: 10px 0;
      font-size: 0.9rem;
    }
    .warn-box {
      background: var(--warn-bg);
      border-left: 3px solid var(--warn);
      padding: 10px 14px;
      border-radius: 8px;
      margin: 10px 0;
      font-size: 0.9rem;
      color: var(--warn-text);
    }
    .example-pill {
      background: var(--card-2);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
      margin-top: 10px;
      font-size: 0.89rem;
    }

    .check-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      font-size: 0.78rem;
      color: var(--muted);
      background: var(--card-2);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      flex-shrink: 0;
      font-weight: 600;
    }
    .lesson-card.checked .check-toggle {
      background: var(--success);
      color: #052e16;
      border-color: var(--success);
      font-weight: 700;
    }

    /* Interactive Predict Widget */
    .predict-box {
      background: var(--card-2);
      border: 1px dashed var(--accent-2);
      border-radius: 12px;
      padding: 16px;
      margin: 14px 0;
    }
    .predict-box h4 { margin: 0 0 8px; font-size: 0.95rem; color: var(--accent-2); }
    .predict-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

    /* Tables */
    .table-wrap { overflow-x: auto; margin: 12px 0; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; background: var(--card); }
    th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: var(--card-2); color: var(--accent); font-weight: 700; }

    /* Quiz */
    .quiz-box {
      background: var(--card);
      border: 1px solid var(--accent-2);
      border-radius: var(--radius);
      padding: 22px;
      margin-top: 30px;
    }
    .quiz-q { margin-bottom: 18px; }
    .quiz-q p { font-weight: 700; margin: 0 0 8px; }
    .quiz-opt {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      font-size: 0.88rem;
    }
    .quiz-opt:hover { border-color: var(--accent); }
    .quiz-opt.correct { background: rgba(34,197,94,0.2); border-color: var(--success); }
    .quiz-opt.wrong { background: rgba(239,68,68,0.2); border-color: var(--danger); }

    /* Flashcards */
    .flashcard-stage { max-width: 640px; margin: 20px auto; text-align: center; }
    .flashcard {
      background: var(--card);
      border: 2px solid var(--accent);
      border-radius: 18px;
      padding: 44px 30px;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
      margin-bottom: 16px;
    }
    .flashcard small { color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: 700; }
    .flashcard h3 { font-size: 1.35rem; margin: 0; }
    .flashcard p { color: var(--text-soft); margin: 12px 0 0; font-size: 0.98rem; }

    .badges-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }
    .badge-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      opacity: 0.45;
      text-align: center;
    }
    .badge-card.unlocked { opacity: 1; border-color: var(--warn); background: var(--warn-bg); }
    .badge-icon { font-size: 1.9rem; margin-bottom: 6px; }

    .mobile-toggle { display: none; }
    @media (max-width: 880px) {
      .app-shell { grid-template-columns: 1fr; }
      aside { position: fixed; left: -320px; width: 295px; z-index: 50; transition: left 0.25s; }
      aside.open { left: 0; }
      main { padding: 18px 16px 80px; }
      .mobile-toggle { display: inline-flex; }
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--success);
      color: #052e16;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar">
    <div class="brand-box">
      <h1>PR Crux, Learnings & Nuggets</h1>
      <p>By Saumya Sharma & Apoorv Singh</p>
    </div>

    <div class="hud-card">
      <div class="hud-top">
        <span class="rank-badge" id="rankBadge">Level 1: PR Rookie</span>
        <span class="xp-text" id="xpText">0 XP</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="overallProgressFill"></div>
      </div>
      <div class="hud-stats">
        <span id="overallPercent">0% Complete</span>
        <span id="modulesCount">0 / 9 Modules</span>
      </div>
    </div>

    <div class="nav-list" id="navList"></div>

    <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px;">
      <button class="btn btn-outline" onclick="copyShareSummary()">📤 Copy My Progress Report</button>
      <button class="btn btn-outline" style="font-size:0.76rem; color:var(--muted);" onclick="resetAllProgress()">Reset Progress</button>
    </div>
  </aside>

  <main>
    <div class="top-bar">
      <div class="mode-pills">
        <button class="pill-btn mobile-toggle" onclick="toggleSidebar()">☰ Modules</button>
        <button class="pill-btn active" id="tabLearn" onclick="switchView('learn')">📚 Study Guide</button>
        <button class="pill-btn" id="tabFlash" onclick="switchView('flashcards')">⚡ Flashcards</button>
        <button class="pill-btn" id="tabBadges" onclick="switchView('badges')">🏆 Badges</button>
        <button class="pill-btn" id="themeBtn" onclick="toggleTheme()">☀️ Light Mode</button>
      </div>
      <input type="text" class="search-input" id="searchInput" placeholder="Search anything in the guide..." oninput="handleSearch(this.value)" />
    </div>

    <div id="mainContent"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const MODULES = [
  /* =========================================================
     MODULE 1: PR LEADERS, BOOKS & CHANNELS
  ========================================================= */
  {
    id: "m1",
    num: 1,
    title: "PR Leaders, Books & Channels",
    subtitle: "Who to follow by niche, what real problems they solved, essential books & where to stay updated.",
    layman: "If you are new to Public Relations, think of this module as your curated starter map. Instead of drowning in random marketing advice, here are the exact practitioners, frameworks, books, podcasts, and blogs worth learning from—grouped by the real-world problem each one solves.",
    sections: [
      {
        heading: "A. Trust and Measurement (The 'Prove PR Works' Problem)",
        items: [
          {
            id: "m1_edelman",
            title: "1. Richard Edelman — President/CEO, Edelman",
            sub: "World's largest independent PR firm | linkedin.com/in/richard-edelman-8647306",
            body: "<p><strong>What he built:</strong> The <strong>Edelman Trust Barometer</strong>, a 25+ year annual cross-country trust survey.</p><div class='callout'><strong>What problem it solved:</strong> Historically, PR struggled to prove its value to CEOs and boards because it relied on stories and anecdotes. The Trust Barometer moved PR conversations with CEOs and boards from anecdote to shared, credible data on institutional trust.</div>"
          },
          {
            id: "m1_dietrich",
            title: "2. Gini Dietrich — Founder/CEO, Spin Sucks",
            sub: "linkedin.com/in/ginidietrich",
            body: "<p><strong>What she created:</strong> The <strong>PESO Model</strong> (Paid, Earned, Shared, Owned media).</p><div class='callout'><strong>What problem it solved:</strong> Companies used to treat PR (press coverage), content marketing (blogs), social media, and paid ads as separate departments fighting for budget. The PESO Model gave practitioners one unified framework to plan and justify budget across all four channels instead of treating them as separate silos.</div>"
          }
        ]
      },
      {
        heading: "B. Going from India to International (Outbound Playbook)",
        items: [
          {
            id: "m1_mantri",
            title: "1. Nitin Mantri — Group CEO, Avian WE; Regional MD APAC, WE Communications",
            sub: "First Asian President of ICCO (2019–22); Past President, PRCAI | linkedin.com/in/nitinmantri",
            body: "<p>Grew a Delhi agency into a WE Communications-affiliated regional operation while building international credibility through ICCO (International Communications Consultancy Organisation) and PRCA leadership roles.</p><div class='callout'><strong>Why study him:</strong> This is the clearest outbound-from-India playbook on this list—worth studying his career path specifically, not just his content.</div>"

            id: "m1_prabhu",

      {
        heading: "C. Independent / Boutique Practice Building (Going Solo)",

            id: "m1_garrett",

          {

            title: "2. Frank Strong — Founder, Sword and the Script (B2B PR Agency)",

      },
      {

            body: "<p>Unusually candid about why PR client relationships succeed or fail—rare and deeply practical honesty for anyone managing clients.</p>"
          }
        ]
      },
      {
        heading: "F. Books, With the Actual Framework to Take From Each",
        items: [
          {
            id: "m1_books",
            title: "7 Must-Read PR & Strategy Books",
            sub: "Don't just read them—extract these exact frameworks",
            body: "<ol><li><strong>Spin Sucks — Gini Dietrich:</strong> Framework: <strong>PESO Model</strong> (Paid, Earned, Shared, Owned).</li><li><strong>The New Rules of Marketing and PR — David Meerman Scott:</strong> Framework: publishing directly to buyers, bypassing traditional media gatekeepers, and <strong>'newsjacking'</strong> (jumping into breaking news with expert commentary).</li><li><strong>The Pursuit of Reputation — Amith Prabhu and Sujit Patil:</strong> India-specific, built from 75 practitioner interviews—most directly relevant to the Indian market.</li><li><strong>Managing Public Relations — Grunig and Hunt, OR Cutlip and Center's Effective Public Relations — Wilcox and Cameron:</strong> Academic grounding that gives you the <strong>'four models of PR'</strong> vocabulary—lands very well with sophisticated multinational clients who've studied communications theory.</li><li><strong>Contagious: Why Things Catch On — Jonah Berger:</strong> Framework: <strong>STEPPS</strong> (Social Currency, Triggers, Emotion, Public, Practical Value, Stories)—explains scientifically why content spreads.</li><li><strong>On Brand — Aliza Licht:</strong> Personal branding, useful both for positioning yourself and for advising executive clients.</li><li><strong>Trust Me, I'm Lying — Ryan Holiday:</strong> Not a how-to guide—it's a behind-the-scenes look at how digital media incentives reward outrage over accuracy. Useful for advising clients on what <em>not</em> to do, and understanding how news outlets actually get manipulated.</li></ol>"
          }
        ]
      },
      {
        heading: "G–J. Podcasts, YouTube, Instagram, Medium & Blogs",

          {

            body: "<p><strong>Evidence:</strong> Earliest long royal inscription in classical Sanskrit. Carved on the exact same rock as Ashoka's edicts (Skandagupta added a third inscription c. 455 CE; text in <em>Epigraphia Indica VIII</em>, pp. 45–49).</p><p><strong>What it does:</strong> The first 8 lines record the lake's history across dynasties, crediting Chandragupta Maurya's governor Pushyagupta and Ashoka's officer Tushaspha. Then it documents the breach (420 cubits long and 75 deep)—advisors said it was beyond repair, Minister Suvishakha executed the rebuild. <strong>Claim:</strong> restored stronger, without imposing taxes or forced labour on townspeople.</p><p><strong>Three Mechanisms:</strong> (1) Credited predecessors, including a rival dynasty, before his own claim; (2) Stated the cost structure, not just the outcome; (3) Placed the record on a surface the audience already read, 400 years old by then.</p><div class='warn-box'><strong>Caveat, which is the lesson:</strong> The last 12 lines praise him. It is self-authored, and the 'no taxes' claim is a claim, not audited—making it the oldest surviving version of the 'annual report problem'.</div>"
          },
          {
            id: "m6_3",
            title: "3. Samudragupta's Prayaga Prashasti (4th Century CE)",
            sub: "Allahabad Pillar, Prayagraj | 33-line Sanskrit eulogy by court poet Harisena (Deciphered by James Prinsep, 1837)",
            body: "<p><strong>What happened:</strong> Engraved immediately below Ashoka's edicts with no structural alteration. The pillar carries three rulers across ~1,900 years: Ashoka, Samudragupta, and Jahangir.</p><p><strong>Mechanism:</strong> He didn't commission a new monument. He wrote underneath the most recognized communication artifact in the subcontinent, positioning his record as Ashoka's continuation. That is <strong>credibility transfer executed in stone</strong>—the exact same logic as earning a citation in an established publication rather than publishing a claim on your own blog.</p><div class='warn-box'><strong>Caveats:</strong> It is a paid eulogy by a court employee. Geopolitical geography is corroborated; 'equal to the gods' is not. Always separate verifiable facts from laudatory claims in any reputation document. Also, Jahangir later added his own inscription—reminding us that whatever platform you build authority on gets reused by whoever comes next.</div>"
          },
          {
            id: "m6_4",
            title: "4. Uttaramerur Inscriptions (919 and 921 CE)",
            sub: "Sabha mandapa plinth, Vaikunta Perumal temple, Kanchipuram | Tamil | Parantaka Chola I (12th & 14th regnal years)",
            body: "<p><strong>What was published:</strong> Governance rules in full, carved directly on the wall of the building where the village assembly met: 30 wards; qualifications (tax-paying land, residence on own land, age 35–70, specified education); disqualifications (unsubmitted accounts from a prior term, bribery, misappropriation, acting against the village); selection by <em>kudavolai</em> (palm leaves drawn from a pot); 360-day terms; removal on conviction.</p><p><strong>The move that matters:</strong> The 921 inscription amends the 919 rules. They carved version two next to version one, publicly and permanently, rather than quietly revising it. Publishing rules builds trust; publishing your amendments builds even more. <strong>Direct modern parallel:</strong> AI disclosure policies, editorial standards, and corrections policies—most of which get quietly edited in place when inconvenient.</p><div class='warn-box'><strong>State this yourself:</strong> The franchise was bounded—eligibility was restricted to land-owning Brahmins versed in the Vedas. Do not call it 'ancient democracy.' Naming the restriction is what makes the rest credible.</div>"
          },
          {
            id: "m6_5",
            title: "5. The Arthashastra, and the Error to Avoid",
            sub: "Scholarship: Olivelle, drawing on Trautmann and McClish",
            body: "<p><strong>Popular claim:</strong> 'Chanakya, minister to Chandragupta Maurya, wrote a 4th-century BCE manual on propaganda and public opinion.'</p><p><strong>What scholarship establishes:</strong> The identification of Kautilya with Chanakya is substantially disputed. Patrick Olivelle identifies three phases: source material c. 150 BCE to 50 CE, 'Kautilya recension' c. 50 to 125 CE, and final 'shastric redaction' c. 175 to 300 CE (Trautmann provisionally proposes c. 250 CE). The author-minister identification came later, in Gupta times.</p><div class='callout'><strong>Use it as:</strong> Doctrine on statecraft with honest dating—not as evidence of 4th-century BCE Mauryan practice. Never pitch it as 'Chanakya's 4th-century BCE PR playbook' in front of an international audience.</div>"
          }
        ]
      }
    ],

  /* =========================================================
     MODULE 7: TOP 25 PR LEADERS & THEIR CONTRIBUTIONS
  ========================================================= */
  {
    id: "m7",
    num: 7,
    title: "Top 25 PR Leaders & Their Contributions",
    subtitle: "The complete Hall of Fame (and cautionary tales) from Ivy Lee to Nitin Mantri—plus the 4 meta-patterns.",
    layman: "Every profession has pioneers who invented its tools, theories, business models, and ethical boundaries. Below are all 25 leaders with the exact lesson to take from each, real historical examples, and honest warnings where pioneers failed ethically.",
    filterGroup: true,
    sections: [
      {
        heading: "Founders (1–6)",
        cat: "Founders",
        items: [
          { id: "m7_1", title: "1. Ivy Lee (1877–1934, US)", sub: "Invented the press release and proactive disclosure", body: "<p>His 1906 <strong>Declaration of Principles</strong> stated he worked openly, supplied news rather than advertising, named his clients, and would give further detail to any editor who asked.</p><p><strong>Learning:</strong> In a crisis, give journalists access and facts rather than silence.</p><p><strong>Examples:</strong> (1) 1906 Atlantic City train wreck for the Pennsylvania Railroad (took reporters to the scene by special train, issued factual statement—first modern press release). (2) After the 1914 Ludlow Massacre, had John D. Rockefeller Jr. visit the Colorado mines, meet miners, and be photographed there, resetting the family's public image.</p><div class='warn-box'><strong>Caution:</strong> He later advised IG Farben and was called before Congress in 1934. Disclosure as a method is only as good as who you deploy it for.</div>" },
          { id: "m7_2", title: "2. Edward Bernays (1891–1995, US)", sub: "Named and theorised the 'public relations counsel'; applied psychology & social research to persuasion", body: "<p>Books: <em>Crystallizing Public Opinion</em> (1923), <em>Propaganda</em> (1928).</p><p><strong>Learning:</strong> Don't sell the product—change the circumstances that make people want it. Late in life he argued for licensing of practitioners.</p><p><strong>Examples:</strong> (1) 'Torches of Freedom' (1929) for American Tobacco—women lit Lucky Strikes in the NY Easter Parade framed as emancipation after consulting psychoanalyst A.A. Brill. (2) Beech-Nut bacon—surveyed physicians on whether a hearty breakfast was healthier, publicized the result, and shifted American breakfast habits (recruiting third-party authority instead of buying ads).</p>" },
          { id: "m7_3", title: "3. Doris E. Fleischman (1891–1980, US)", sub: "Equal partner in the Bernays firm; wrote and directed much of the output credited to him", body: "<p>First married American woman issued a passport in her own name (1925).</p><p><strong>Learning:</strong> Argued publicly that a woman's professional identity should survive marriage, and demonstrated it.</p><p><strong>Examples:</strong> (1) Ran counsel and writing across the firm's major accounts for decades. (2) Edited <em>An Outline of Careers for Women</em> (1928). <em>Flag: the precise authorship split between her and Bernays is debated by historians; the passport fact is well documented.</em></p>" },
          { id: "m7_4", title: "4. Arthur W. Page (1883–1960, US)", sub: "First corporate communications executive to sit as a major corporate officer (AT&T VP from 1927)", body: "<p><strong>Learning — The Page Principles:</strong> Tell the truth. Prove it with action. Listen to the stakeholder. Manage for tomorrow. Conduct PR as if the whole company depends on it. Remain calm, patient, and good-humoured. The core claim is that <strong>PR is a management function, not a publicity function</strong>.</p><p><strong>Examples:</strong> (1) Built public acceptance of AT&T's regulated monopoly by framing it as public service. (2) The Arthur W. Page Society (founded 1983) is now the senior corporate communications body in the US.</p>" },
          { id: "m7_5", title: "5. Carl Byoir (1888–1957, US)", sub: "Pioneer of the third-party campaign and grassroots mobilisation", body: "<p><strong>Learning:</strong> Build an event or a cause the media cannot ignore, rather than asking for coverage.</p><p><strong>Examples:</strong> (1) The President's Birthday Balls for FDR from 1934, raising funds for polio research (forerunner of the March of Dimes). (2) Defended A&P against chain-store taxes by organising farmers and consumers rather than lobbying directly.</p>" },
          { id: "m7_6", title: "6. John W. Hill (1890–1977, US)", sub: "Founded Hill & Knowlton in 1927; built the first genuinely multinational PR firm", body: "<p><strong>Learning:</strong> Industry-wide problems need industry-wide communication vehicles. (The lesson the industry actually took is the opposite cautionary one.)</p><p><strong>Examples:</strong> (1) Created the Tobacco Industry Research Committee and the 'A Frank Statement to Cigarette Smokers' ad of January 1954, which manufactured scientific doubt about smoking and health for decades—the most consequential PR campaign ever run and the standard teaching case for what <em>not</em> to do. (2) Built the multinational network model that holding companies later acquired wholesale.</p>" }
        ]
      },
      {
        heading: "Theory & Measurement (7–11)",
        cat: "Theory & Measurement",
        items: [
          { id: "m7_7", title: "7. Scott M. Cutlip (1915–2000, US)", sub: "Standardized PR education & critical history", body: "<p><strong>Learning:</strong> PR must be taught as a research-based management discipline, and its own history told honestly, including the failures.</p><p><strong>Examples:</strong> (1) <em>Effective Public Relations</em> (1952, with Allen Center), the foundational textbook still in print. (2) <em>The Unseen Power: Public Relations, A History</em> (1994), a critical insider account of the industry's origins.</p>" },
          { id: "m7_8", title: "8. James E. Grunig (b. 1942, US)", sub: "The most cited theorist in the field", body: "<p><strong>Learning:</strong> Four models of practice: Press agentry, public information, two-way asymmetrical, two-way symmetrical. The argument is that symmetrical, dialogue-based practice is both more ethical and more effective.</p><p><strong>Examples:</strong> (1) <em>Managing Public Relations</em> (1984, with Todd Hunt). (2) Led the IABC Excellence Study, a multi-year multi-country research programme producing Excellence Theory—the evidence most used to argue PR belongs in the C-suite.</p>" },
          { id: "m7_9", title: "9. W. Timothy Coombs (US)", sub: "Situational Crisis Communication Theory (SCCT)", body: "<p><strong>Learning:</strong> Match the crisis response to how much responsibility stakeholders attribute to you. <em>Victim cluster</em>, <em>accidental cluster</em>, and <em>preventable cluster</em> each need a different response—using the wrong one actively worsens the damage.</p><p><strong>Examples:</strong> (1) SCCT underlies most modern crisis playbooks. (2) <em>Ongoing Crisis Communication</em> (1999) operationalised the crisis lifecycle: prevention, preparation, response, revision.</p>" },
          { id: "m7_10", title: "10. Katie Delahaye Paine (US)", sub: "Outcomes & relationships over clippings; anti-AVE pioneer", body: "<p><strong>Learning:</strong> Measure outcomes and relationships, not clippings. Long-running campaigner against AVEs.</p><p><strong>Examples:</strong> (1) <em>Measure What Matters</em> (2011) and her newsletter made measurement usable without statistics training. (2) Contributed to AMEC's work producing the Barcelona Principles as the global standard replacing AVEs.</p>" },
          { id: "m7_11", title: "11. Anne Gregory (UK)", sub: "Enforceable ethics & global practitioner capability", body: "<p><strong>Learning:</strong> PR's legitimacy rests on an agreed body of knowledge and enforceable ethics, not on individual reputations.</p><p><strong>Examples:</strong> (1) Chaired the Global Alliance for Public Relations and Communication Management and led the Global Capability Framework defining practitioner competence across countries. (2) CIPR president and author of <em>Planning and Managing Public Relations Campaigns</em>.</p>" }
        ]
      },
      {
        heading: "Agency Builders (12–17)",
        cat: "Agency Builders",
        items: [
          { id: "m7_12", title: "12. Harold Burson (1921–2020, US)", sub: "Co-founded Burson-Marsteller (1953) | Voted 20th century's most influential PR figure", body: "<p><strong>Learning:</strong> His summary of the field's evolution: the question moved from 'how should we say it' → 'what should we say' → 'what should we do.' Influence is earned by changing behaviour, not language.</p><p><strong>Examples:</strong> (1) Advised J&J through the 1982 Tylenol cyanide crisis. (2) Built one of the two largest global firms and trained a generation of agency leaders.</p>" },
          { id: "m7_13", title: "13. Daniel J. Edelman (1920–2013, US)", sub: "Founded Edelman in 1952; invented the media tour", body: "<p><strong>Learning:</strong> Create news the client owns rather than buying attention.</p><p><strong>Examples:</strong> (1) The Toni Twins tour in the 1950s for home permanents—identical twins travelled US cities (one with a salon perm, one with Toni) and media guessed which was which; prototype of the national media tour. (2) Built and held the world's largest independent PR firm, proving independents can compete with holding companies at scale.</p>" },
          { id: "m7_14", title: "14. Richard Edelman (b. 1954, US)", sub: "CEO of Edelman | Annual proprietary trust research", body: "<p><strong>Learning:</strong> Trust is the asset PR actually manages, and you can own a conversation by measuring it annually and publishing.</p><p><strong>Examples:</strong> (1) The Edelman Trust Barometer (launched 2001), now a Davos fixture and the single most cited dataset in the industry—a firm manufacturing global authority through proprietary research. (2) Pushed the firm toward earned-centric integrated comms and public positions on client categories. <em>Flag: the scope and consistency of those client policies has been publicly contested.</em></p>" },
          { id: "m7_15", title: "15. Tim Bell (1941–2019, UK)", sub: "The Cautionary Case", body: "<p><strong>Learning:</strong> Reputational work carries the moral weight of its client, and the bill always arrives. Useful precisely as the cautionary case.</p><p><strong>Examples:</strong> (1) Advised Margaret Thatcher's election campaigns alongside Saatchi & Saatchi, including 1979 'Labour Isn't Working.' (2) Bell Pottinger collapsed in 2017 after its work for the Gupta family in South Africa was found to have stoked racial division. The PRCA expelled the firm and it entered administration within weeks—fastest destruction of a major agency on record.</p>" },
          { id: "m7_16", title: "16. Alan Parker (UK)", sub: "Founded Brunswick in 1987; defined financial & corporate advisory PR", body: "<p><strong>Learning:</strong> In high-stakes corporate situations the audience is small and specific. The work is counsel, not publicity.</p><p><strong>Examples:</strong> (1) Built Brunswick into the dominant global M&A and crisis advisory firm. (2) Proved the premium-fee advisory model where PR sits alongside bankers and lawyers rather than reporting into marketing—the single most useful structural precedent for moving upmarket.</p>" },
          { id: "m7_17", title: "17. Robert L. Dilenschneider (b. 1943, US)", sub: "CEO of Hill & Knowlton in 1980s → Founded The Dilenschneider Group in 1991", body: "<p><strong>Learning:</strong> Influence is built through relationships maintained before you need them, not activated when you do.</p><p><strong>Examples:</strong> (1) <em>Power and Influence: The Rules Have Changed</em> (1990). (2) Built a high-margin boutique advisory practice after leaving a holding company—the template for senior practitioners going independent.</p>" }
        ]
      },
      {
        heading: "Institution & Access Builders (18–20) + Positioning, Digital, Global (21–25)",
        cat: "Institution & Global",
        items: [
          { id: "m7_18", title: "18. Betsy Plank (1924–2010, US)", sub: "First woman to serve as president of PRSA (1973)", body: "<p><strong>Learning:</strong> The profession's future depends on education and bringing entrants in properly. Drove PRSSA and the industry-to-university link; the Plank Center at the University of Alabama continues the work.</p>" },
          { id: "m7_19", title: "19. Inez Y. Kaiser (1918–2016, US)", sub: "First African American woman to lead a PR firm (1957, Kansas City) & win national clients", body: "<p>Won 7 Up, Sterling Drug, Sears, and Lever Brothers; first African American woman to join PRSA and Greater Kansas City Chamber of Commerce.</p><p><strong>Learning:</strong> She built her distribution <em>before</em> she had clients, through a syndicated fashion column carried in Black newspapers nationally—which is why she could sign national accounts almost immediately on opening. She also attributed winning 7 Up to admitting she did not know the answer to a question and promising to return with it inside a day. Advised Presidents Nixon, Ford, and Reagan.</p>" },
          { id: "m7_20", title: "20. Ofield Dukes (1932–2011, US)", sub: "Leading Black-owned practice in Washington DC; connected PR to civil rights", body: "<p><strong>Learning:</strong> Representation inside the industry is a precondition for credible communication with the audiences it claims to reach. Advised the DNC and Congressional Black Caucus, worked on establishing Martin Luther King Jr. Day, received PRSA's Gold Anvil, and mentored Black practitioners via Howard University. <em>(Flag: from training data, not verified in session.)</em></p>" },
          { id: "m7_21", title: "21. Al Ries (1926–2022) and Laura Ries (US)", sub: "Positioning & Primacy of PR over Advertising", body: "<p><strong>Learning:</strong> You cannot build a brand with advertising because advertising lacks credibility. <strong>You build with PR and defend with advertising.</strong></p><p><strong>Examples:</strong> (1) <em>Positioning: The Battle for Your Mind</em> (1981, with Jack Trout)—a brand occupies a relative place in the mind rather than a list of attributes. (2) <em>The Fall of Advertising and the Rise of PR</em> (2002).</p>" },
          { id: "m7_22", title: "22. David Meerman Scott (US)", sub: "Direct publishing & Newsjacking", body: "<p><strong>Learning:</strong> You no longer need the media to reach the audience—publish directly. And 'newsjacking,' inserting your expertise into a breaking story while it is still breaking.</p><p><strong>Examples:</strong> <em>The New Rules of Marketing and PR</em> (2007) and <em>Newsjacking</em> (2011).</p>" },
          { id: "m7_23", title: "23. Paul Holmes (UK/US)", sub: "Independent scrutiny of the PR profession", body: "<p><strong>Learning:</strong> A profession needs independent scrutiny of itself. Consistently critical of holding-company logic, including in 2026.</p><p><strong>Examples:</strong> Founded The Holmes Report (now PRovoke Media), the SABRE Awards (judging campaigns on business outcomes rather than craft), and Global 250 rankings.</p>" },
          { id: "m7_24", title: "24. Prema Sagar (India)", sub: "Founded Genesis PR (Nov 1, 1992) & Founding President of PRCAI", body: "<p>Trained at Frank Jefkins Institute, London; India council member of IPRA, ICCO board member. Acquired by Burson-Marsteller in 2005 (now Genesis BCW).</p><p><strong>Learning:</strong> Her own phrase is they had to do <strong>'PR for PR.'</strong> In an immature market you sell the category before you sell your firm. She launched deliberately in the year of India's liberalisation, when inbound foreign companies knew what PR was and local companies did not. Scaled a 5-person basement firm across Delhi, Mumbai, Bangalore, and Kolkata, and founded PRCAI and Genesis School of Communication.</p>" },
          { id: "m7_25", title: "25. Nitin Mantri (India)", sub: "Group CEO of Avian WE | First Asian President of ICCO (2019–2022) | ICCO Hall of Fame (2022)", body: "<p>President of PRCAI (2015–2020).</p><p><strong>Learning:</strong> Regional industries gain international standing through institutional participation, not only through winning work. Pushed ethics and inclusion onto the global agenda. Grew Avian roughly fortyfold from a Delhi startup, led acquisition by WE Communications, and led ICCO through the pandemic when global bodies were almost entirely Western-led.</p>" }
        ]
      },
      {
        heading: "What the List Actually Tells You (4 Big Patterns)",
        cat: "Synthesis",
        items: [
          {
            id: "m7_patterns",
            title: "Four Patterns Running Through All 25 Leaders",
            sub: "Why this is worth far more than a reference list",
            body: "<ol><li><strong>Build an asset, not a reputation:</strong> The people with lasting authority built something the industry <em>has</em> to refer to—which keeps working while they sleep. Page built principles. Grunig built evidence. Richard Edelman built a dataset. Paul Holmes built rankings. Prema Sagar built an association.</li><li><strong>Change behaviour, not just perception:</strong> The most consequential campaigns changed behaviour. Bernays changed what people ate. Hill changed what people believed about evidence. Byoir changed how disease research was funded.</li><li><strong>Two of the most instructive entries are failures:</strong> Hill and Bell both executed brilliantly for clients they should have refused. In both cases, craft was not the problem.</li><li><strong>The entry most applicable to your position is Richard Edelman:</strong> Not any of the founders. He took an annual research instrument, published it consistently for 25 years, and turned it into the industry's reference point—a strategy available to a firm of any size that travels across borders without an office.</li></ol>"

  /* =========================================================
     MODULE 8: PERSONAL BRANDING KEYWORDS (ALL 61 TERMS)
  ========================================================= */
  {

    num: 8,
    title: "Personal Branding Keywords (61 Terms)",
    subtitle: "Complete practitioner glossary—every definition, historical origin, and real-world example.",
    layman: "PR and executive branding have their own vocabulary. Below is the complete glossary grouped by where each term shows up in real work—complete with concrete examples so you never have to guess how a phrase is actually used.",
    filterGroup: true,
    sections: [
      {
        heading: "1. Foundations (13 Terms)",
        cat: "Foundations",
        items: [
          {
            id: "m8_f1",
            title: "Personal Brand, Reputation vs. Brand, Positioning & Niche",
            sub: "Origins: Tom Peters (1997) | Al Ries & Jack Trout (1981)",
            body: "<ul><li><strong>Personal brand:</strong> What a specific audience expects from you, based on everything they've seen, heard, and been told about you. Coined in Tom Peters' <em>Fast Company</em> article 'The Brand Called You' (Aug/Sept 1997), urging readers to see themselves as CEO of 'Me Inc.' <em>Example:</em> A cardiologist known among peers as 'the one who explains trial data in plain language.'</li><li><strong>Reputation vs. brand:</strong> Brand is what you project. Reputation is what others conclude. The gap between them is the work. <em>Example:</em> An executive projects 'innovator,' but the press describes him as 'cost-cutter'—that's a reputation problem, not a branding one.</li><li><strong>Positioning:</strong> Owning one specific idea in the audience's mind, relative to alternatives (Ries & Trout, 1981). <em>Example:</em> 'The fintech founder who talks about regulation' rather than 'a fintech founder.'</li><li><strong>Niche / category of one:</strong> A narrow enough focus that you face few direct competitors for attention. <em>Example:</em> 'Supply chain lawyer for EV battery makers' instead of 'corporate lawyer.'</li></ul>"
          },
          {
            id: "m8_f2",
            title: "Value Proposition, 'Known For' Statement, Brand Pillars & Voice",
            sub: "Practical positioning toolkit",
            body: "<ul><li><strong>Value proposition (personal):</strong> The specific problem you solve and for whom, in one line. <em>Example:</em> 'I help family-owned manufacturers hand over to the next generation without losing key clients.'</li><li><strong>'Known for' statement:</strong> A one-sentence answer to 'what do people say you're the go-to person for?' Used as an audit question. <em>Example:</em> Ask five colleagues and compare their answers to the one you want.</li><li><strong>Brand pillars:</strong> The 3 to 5 themes or attributes the brand consistently stands on. <em>Example:</em> A CFO's pillars might be capital discipline, transparency with investors, and mentoring women in finance.</li><li><strong>Brand voice / tone:</strong> How you sound, kept consistent across channels. <em>Example:</em> Blunt and data-led on LinkedIn, and the same voice in a podcast—not suddenly motivational.</li></ul>"
          },
          {
            id: "m8_f3",
            title: "Archetype, Brand Promise, Brand Equity, Origin Story & Authenticity Gap",
            sub: "Origin: Margaret Mark & Carol Pearson, The Hero and the Outlaw (2001)",
            body: "<ul><li><strong>Brand archetype:</strong> A personality template drawn from Jungian archetypes (Mark & Pearson, 2001). <em>Example:</em> A 'Sage' archetype educates; a 'Rebel' archetype challenges industry norms.</li><li><strong>Brand promise:</strong> What the audience can reliably expect every time they interact with you. <em>Example:</em> 'If she speaks at your conference, you'll leave with one number you didn't know.'</li><li><strong>Brand equity (personal):</strong> The accumulated value of the reputation: higher fees, inbound offers, forgiveness in a mistake. <em>Example:</em> A known consultant charges 3x a peer with the same skills.</li><li><strong>Origin story / signature story:</strong> The narrative of why you do what you do; humanises expertise. <em>Example:</em> A cybersecurity founder whose family business was ransomwared.</li><li><strong>Authenticity gap:</strong> The distance between the persona presented and observed behaviour. Audiences punish this hard. <em>Example:</em> A CEO posting about work-life balance while staff describe a burnout culture.</li></ul>"
          }
        ]
      },
      {
        heading: "2. Content and Visibility (16 Terms)",
        cat: "Content & Visibility",
        items: [
          {
            id: "m8_c1",

            sub: "Origins: Joel Kurtzman (1994) | David Meerman Scott (2011)",

  const t = document.getElementById("toast");

  t.style.display = "block";
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.display = "none"; }, 2400);
}

  const allIds = getAllItemIds();
  const doneCount = state.checked.length;
  const pct = Math.round((doneCount / allIds.length) * 100);
  const doneMods = MODULES.filter(isModuleDone).length;

  document.getElementById("rankBadge").textContent = getRank(state.xp);
  document.getElementById("xpText").textContent = `${state.xp} XP`;
  document.getElementById("overallProgressFill").style.width = `${pct}%`;
  document.getElementById("overallPercent").textContent = `${pct}% (${doneCount}/${allIds.length} units)`;
  document.getElementById("modulesCount").textContent = `${doneMods} / ${MODULES.length} Modules`;
  document.getElementById("themeBtn").textContent = state.theme === "light" ? "🌙 Dark Mode" : "☀️ Light Mode";
}

function renderSidebar() {
  const nav = document.getElementById("navList");
  nav.innerHTML = MODULES.map(m => {
    const ids = [];
    m.sections.forEach(s => s.items.forEach(it => ids.push(it.id)));
    const doneInMod = ids.filter(id => state.checked.includes(id)).length;
    const allDone = doneInMod === ids.length;
    const isActive = currentView === "learn" && state.activeModule === m.id && !searchQuery;

    return `
      <button class="nav-btn ${isActive ? 'active' : ''} ${allDone ? 'done' : ''}" onclick="selectModule('${m.id}')">
        <span style="display:flex;align-items:center;gap:8px;min-width:0;">
          <span class="status-dot">${allDone ? '✓' : m.num}</span>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${m.title}</span>
        </span>
        <span class="nav-meta">${doneInMod}/${ids.length}</span>
      </button>
    `;
  }).join("");
}

function toggleItem(id) {
  const idx = state.checked.indexOf(id);
  if (idx === -1) {
    state.checked.push(id);
    state.xp += 20;
    showToast("+20 XP! Marked as understood");
  } else {
    state.checked.splice(idx, 1);
    state.xp = Math.max(0, state.xp - 20);
  }
  saveState();
  renderAll();
}

function markModuleComplete(modId) {
  const mod = MODULES.find(m => m.id === modId);
  let added = 0;
  mod.sections.forEach(s => s.items.forEach(it => {
    if (!state.checked.includes(it.id)) {
      state.checked.push(it.id);
      added++;
    }
  }));
  if (added > 0) {
    state.xp += added * 20 + 30;
    showToast(`Module Complete! +${added * 20 + 30} XP 🎉`);
  } else {
    showToast("Module already completed!");
  }
  saveState();
  renderAll();
}

function answerQuiz(modId, qIdx, optIdx, btn) {
  const mod = MODULES.find(m => m.id === modId);
  const q = mod.quiz[qIdx];
  const parent = btn.parentElement;
  if (parent.dataset.answered) return;
  parent.dataset.answered = "1";

  const buttons = parent.querySelectorAll(".quiz-opt");
  buttons.forEach((b, i) => {
    if (i === q.ans) b.classList.add("correct");
    else if (i === optIdx) b.classList.add("wrong");
  });

  const expEl = document.createElement("div");
  expEl.style.fontSize = "0.86rem";
  expEl.style.marginTop = "8px";
  expEl.style.padding = "8px 10px";
  expEl.style.borderRadius = "8px";
  expEl.style.background = "var(--card-2)";
  expEl.textContent = (optIdx === q.ans ? "✅ Correct! " : "❌ Not quite. ") + q.exp;
  parent.appendChild(expEl);

  if (optIdx === q.ans) {
    state.xp += 25;
    if (!state.quizzesPassed.includes(`${modId}_${qIdx}`)) {
      state.quizzesPassed.push(`${modId}_${qIdx}`);
    }
    saveState();
    updateHUD();
    showToast("+25 Bonus XP!");
  }
}

function renderCardHTML(it) {
  const isChecked = state.checked.includes(it.id);
  return `
    <article class="lesson-card ${isChecked ? 'checked' : ''}">
      <div class="card-header">
        <div>
          <h4 class="card-title">${it.title}</h4>
          <div class="card-sub">${it.sub}</div>
        </div>
        <button class="check-toggle" onclick="toggleItem('${it.id}')">
          ${isChecked ? '✓ Understood' : 'Mark Complete'}
        </button>
      </div>
      <div class="card-body">${it.body}</div>
    </article>
  `;
}

function setSubFilter(cat) {
  activeSubFilter = cat;
  renderMain();
}

function renderMain() {
  const container = document.getElementById("mainContent");

  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    const matches = [];
    MODULES.forEach(m => m.sections.forEach(s => s.items.forEach(it => {
      if ((it.title + it.sub + it.body).toLowerCase().includes(q)) {
        matches.push({ mod: m.title, item: it });
      }
    })));
    container.innerHTML = `
      <div class="module-hero">
        <div class="hero-top">
          <div>
            <h2>Search Results for "${searchQuery}"</h2>
            <p>Found ${matches.length} matching unit(s) across all 9 modules.</p>
          </div>
          <button class="btn btn-outline" onclick="clearSearch()">Clear Search</button>
        </div>
      </div>
      <div class="lesson-stack">
        ${matches.length ? matches.map(m => renderCardHTML(m.item)).join("") : "<p style='color:var(--muted)'>No matches found. Try another keyword.</p>"}
      </div>
    `;
    return;
  }

  if (currentView === "flashcards") {
    const card = FLASHCARDS[flashIndex];
    container.innerHTML = `
      <div class="module-hero">
        <div class="hero-top">
          <div>
            <h2>⚡ Flashcard Arena</h2>
            <p>Click the card to flip and test your understanding of key frameworks, 2026 data & PR principles (+5 XP per flip).</p>
          </div>
          <span class="rank-badge">Card ${flashIndex + 1} of ${FLASHCARDS.length}</span>
        </div>
      </div>
      <div class="flashcard-stage">
        <div class="flashcard" onclick="flipFlashcard()">
          <small>${flashFlipped ? 'Answer & Meaning' : 'Concept / Prompt (Click to Reveal)'}</small>
          <h3>${flashFlipped ? '' : card.front}</h3>
          <p>${flashFlipped ? card.back : 'Tap anywhere on this card to flip'}</p>
        </div>
        <div style="display:flex; justify-content:center; gap:12px;">
          <button class="btn btn-outline" onclick="prevFlash()">← Previous</button>
          <button class="btn" onclick="nextFlash()">Next Card →</button>
        </div>
      </div>
    `;
    return;
  }

  if (currentView === "badges") {
    const tot = getAllItemIds().length;
    container.innerHTML = `
      <div class="module-hero">
        <h2>🏆 Achievements & Mastery</h2>
        <p>Unlock badges as you read through all 9 modules, pass knowledge checks, and flip flashcards.</p>
      </div>
      <div class="badges-grid">
        ${BADGES.map(b => {
          const unlocked = b.check(state, tot);
          return `
            <div class="badge-card ${unlocked ? 'unlocked' : ''}">
              <div class="badge-icon">${b.icon}</div>
              <h4 style="margin:0 0 4px;">${b.name}</h4>
              <p style="margin:0; font-size:0.82rem; color:var(--muted);">${b.desc}</p>
              <div style="margin-top:8px; font-size:0.74rem; font-weight:700; color:${unlocked ? 'var(--warn)' : 'var(--muted)'}">
                ${unlocked ? 'UNLOCKED' : 'LOCKED'}
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;
    return;
  }

  const mod = MODULES.find(m => m.id === state.activeModule) || MODULES[0];
  const modDone = isModuleDone(mod);
  const modIdx = MODULES.findIndex(m => m.id === mod.id);
  const nextMod = MODULES[modIdx + 1];

  const cats = mod.filterGroup ? ["All", ...new Set(mod.sections.map(s => s.cat).filter(Boolean))] : [];
  if (!cats.includes(activeSubFilter)) activeSubFilter = "All";

  const visibleSections = mod.filterGroup && activeSubFilter !== "All"
    ? mod.sections.filter(s => s.cat === activeSubFilter)
    : mod.sections;

  container.innerHTML = `
    <div class="module-hero">
      <div class="hero-top">
        <div style="max-width:600px;">
          <span class="rank-badge">MODULE ${mod.num} OF ${MODULES.length}</span>
          <h2>${mod.title}</h2>
          <p>${mod.subtitle}</p>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn ${modDone ? 'btn-success' : ''}" onclick="markModuleComplete('${mod.id}')">
            ${modDone ? '✓ Module Completed' : '✓ Mark Whole Module Complete'}
          </button>
          ${nextMod ? `<button class="btn btn-outline" onclick="selectModule('${nextMod.id}')">Next: Module ${nextMod.num} →</button>` : ''}
        </div>
      </div>
      <div class="layman-box">
        <strong>💡 Why This Matters (Plain-English Intro):</strong> ${mod.layman}
      </div>
    </div>

    ${cats.length ? `
      <div class="filter-bar">
        ${cats.map(c => `<button class="filter-chip ${activeSubFilter === c ? 'active' : ''}" onclick="setSubFilter('${c}')">${c}</button>`).join("")}
      </div>
    ` : ''}

    ${visibleSections.map(sec => `
      <div class="section-group">
        <h3 class="section-title"><span>◆ ${sec.heading}</span></h3>
        <div class="lesson-stack">
          ${sec.items.map(renderCardHTML).join("")}
        </div>
      </div>
    `).join("")}

    ${mod.quiz && mod.quiz.length ? `
      <div class="quiz-box">
        <h3 style="margin:0 0 14px; color:var(--accent-2);">🧠 Module ${mod.num} Check Your Understanding (+25 XP each)</h3>
        ${mod.quiz.map((q, qi) => `
          <div class="quiz-q">
            <p>${qi + 1}. ${q.q}</p>
            ${q.opts.map((opt, oi) => `
              <button class="quiz-opt" onclick="answerQuiz('${mod.id}', ${qi}, ${oi}, this)">${opt}</button>
            `).join("")}
          </div>
        `).join("")}
      </div>
    ` : ''}
  `;
}

function selectModule(id) {
  state.activeModule = id;
  currentView = "learn";
  activeSubFilter = "All";
  searchQuery = "";
  document.getElementById("searchInput").value = "";
  saveState();
  updatePills();
  renderAll();
  document.getElementById("sidebar").classList.remove("open");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function switchView(view) {
  currentView = view;
  searchQuery = "";
  document.getElementById("searchInput").value = "";
  updatePills();
  renderAll();
}

function updatePills() {
  document.getElementById("tabLearn").classList.toggle("active", currentView === "learn");
  document.getElementById("tabFlash").classList.toggle("active", currentView === "flashcards");
  document.getElementById("tabBadges").classList.toggle("active", currentView === "badges");
}

function handleSearch(val) { searchQuery = val; renderMain(); }
function clearSearch() { searchQuery = ""; document.getElementById("searchInput").value = ""; renderAll(); }

function flipFlashcard() {
  flashFlipped = !flashFlipped;
  if (flashFlipped) {
    state.flips += 1;
    state.xp += 5;
    saveState();
    updateHUD();
  }
  renderMain();
}
function nextFlash() { flashIndex = (flashIndex + 1) % FLASHCARDS.length; flashFlipped = false; renderMain(); }
function prevFlash() { flashIndex = (flashIndex - 1 + FLASHCARDS.length) % FLASHCARDS.length; flashFlipped = false; renderMain(); }
function toggleSidebar() { document.getElementById("sidebar").classList.toggle("open"); }

function copyShareSummary() {
  const tot = getAllItemIds().length;
  const pct = Math.round((state.checked.length / tot) * 100);
  const doneMods = MODULES.filter(isModuleDone).length;
  const text = `PR Crux Learning Progress: ${pct}% Complete (${doneMods}/9 modules, ${state.checked.length}/${tot} units) | ${getRank(state.xp)} (${state.xp} XP)`;
  navigator.clipboard.writeText(text).then(() => showToast("Progress summary copied!")).catch(() => alert(text));
}

function resetAllProgress() {
  if (confirm("Reset all XP, badges, and completed units?")) {
    state = { checked: [], quizzesPassed: [], xp: 0, flips: 0, activeModule: "m1", theme: state.theme };
    saveState();
    renderAll();
    showToast("Progress reset.");
  }
}

function renderAll() {
  updateHUD();
  renderSidebar();
  renderMain();
}

renderAll();
</script>
</body>
</html>
