[build]
  publish = "public"

[build.environment]
  NODE_VERSION = "24"

[server]
  path = "/api/*"

# Revalidate the entry page so visitors receive new prototype features after deploys.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
